<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="feature" content="{{FEATURE}}">
<style>
:root {
  --bg: #f6f6f4; --surface: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --border: #e2e1dc;
  --done: #2f7d4f; --done-bg: #e6f2ea;
  --active: #2459c7; --active-bg: #e7eefb;
  --wait: #8a5a00; --wait-bg: #fbf1dc;
  --blocked: #8d8d87; --blocked-bg: #f0efeb;
  --crit: #c2410c;
  --gate: #6d28d9; --gate-bg: #f1ebfd;
  --ca: #0e7490; --cb: #a16207; --cc: #be185d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #1f1f1d; --text: #ecebe6; --muted: #a09f99; --border: #34332f;
    --done: #6cc28f; --done-bg: #1c3326; --active: #7fa6f5; --active-bg: #1d2a45;
    --wait: #e0b25c; --wait-bg: #3a2e14; --blocked: #8d8d87; --blocked-bg: #262624;
    --crit: #fb923c; --gate: #b69cf7; --gate-bg: #2a2140;
    --ca: #4fc3d9; --cb: #e0b25c; --cc: #f472b6;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #1f1f1d; --text: #ecebe6; --muted: #a09f99; --border: #34332f;
  --done: #6cc28f; --done-bg: #1c3326; --active: #7fa6f5; --active-bg: #1d2a45;
  --wait: #e0b25c; --wait-bg: #3a2e14; --blocked: #8d8d87; --blocked-bg: #262624;
  --crit: #fb923c; --gate: #b69cf7; --gate-bg: #2a2140;
  --ca: #4fc3d9; --cb: #e0b25c; --cc: #f472b6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.mock-tag { display: inline-block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--border); border-radius: 4px; padding: 1px 6px; margin-bottom: 8px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 0 0 14px; border-bottom: 1px solid var(--border); scrollbar-width: none; }
.tabs a { flex: none; padding: 10px 12px; min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); font-weight: 600; border-bottom-color: var(--active); }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 10px; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta a { color: var(--active); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 14px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.kpi .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--blocked-bg); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--done); }
.workers { display: grid; grid-template-columns: 1fr; gap: 8px; }
.worker { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; }
.worker b { font-variant-numeric: tabular-nums; }
.worker .slot { font-size: 12px; color: var(--muted); grid-row: span 2; }
.worker .step { font-size: 12px; color: var(--muted); }
.steps { display: flex; gap: 3px; margin-top: 6px; grid-column: 2; }
.steps i { flex: 1; height: 5px; border-radius: 2px; background: var(--blocked-bg); }
.steps i.d { background: var(--done); }
.steps i.a { background: var(--active); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.p-done { color: var(--done); background: var(--done-bg); }
.p-active { color: var(--active); background: var(--active-bg); }
.p-wait { color: var(--wait); background: var(--wait-bg); }
.p-blocked { color: var(--blocked); background: var(--blocked-bg); }
.p-gate { color: var(--gate); background: var(--gate-bg); }
.cl { font-weight: 600; }
.cl-a { color: var(--ca); } .cl-b { color: var(--cb); } .cl-c { color: var(--cc); }
.graph-wrap { display: grid; grid-template-columns: 1fr; gap: 14px; }
svg.dag { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
svg.dag text { font-family: inherit; fill: var(--text); }
svg.dag .sub { fill: var(--muted); font-size: 9.5px; }
svg.dag .ttl { font-size: 11.5px; font-weight: 600; }
.e { fill: none; stroke: var(--border); stroke-width: 1.5; }
.e.c { stroke: var(--crit); stroke-width: 2.4; }
.n-done { fill: var(--done-bg); stroke: var(--done); }
.n-active { fill: var(--active-bg); stroke: var(--active); }
.n-wait { fill: var(--wait-bg); stroke: var(--wait); }
.n-blocked { fill: var(--blocked-bg); stroke: var(--blocked); stroke-dasharray: 3 3; }
.n-gate { fill: var(--gate-bg); stroke: var(--gate); stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; display: inline-block; }
.line { width: 18px; height: 0; border-top: 2.4px solid var(--crit); display: inline-block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
td.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 8px 0; border-bottom: 1px solid var(--border); }
ul.plain li:last-child { border-bottom: 0; }
.src { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
@media (max-width: 719px) {
  table.resp thead { display: none; }
  table.resp tr { display: block; border-bottom: 1px solid var(--border); padding: 8px 0; }
  table.resp td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 3px 0; }
  table.resp td::before { content: attr(data-l); color: var(--muted); font-size: 12px; }
  table.resp td.first { font-weight: 600; }
  table.resp td.first::before { content: none; }
}
@media (min-width: 720px) {
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .workers { grid-template-columns: repeat(2, 1fr); }
  .two { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1100px) {
  .graph-wrap { grid-template-columns: 420px 1fr; align-items: start; }
  .workers { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>
<main>
{{BODY}}
</main>
<script>
(function () {
  var slug = document.querySelector('meta[name="feature"]').content;
  // via localhost: troca o conteúdo quando o servidor avisa, sem recarregar nem perder a rolagem
  if (location.protocol.indexOf("http") === 0 && window.EventSource) {
    var source = new EventSource("/events?f=" + encodeURIComponent(slug));
    source.onmessage = function () {
      fetch(location.pathname, { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (text) {
        var next = new DOMParser().parseFromString(text, "text/html").querySelector("main");
        if (next) document.querySelector("main").innerHTML = next.innerHTML;
      });
    };
    return;
  }
  try { var y = sessionStorage.getItem("tracker-y"); if (y) window.scrollTo(0, parseInt(y, 10)); } catch (e) {}
  setInterval(function () {
    try { sessionStorage.setItem("tracker-y", String(window.scrollY)); } catch (e) {}
    location.reload();
  }, 10000);
})();
</script>
</body>
</html>
